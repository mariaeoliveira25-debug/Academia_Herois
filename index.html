<!DOCTYPE html>
<html lang="pt-BR">
 <head>
    <meta charset="UTF-8"/>
    <title>Academia de Heróis</title>
    <link rel="stylesheet" href="css/syte.css"/>
</head>
<body>
    <header>
        <h1>Academia de Heróis</h1>
        <p>Inscreva-se para participar da próxima missão</p> 
    </header>
         <main>
         <form action="#" method="get">
            <h1>Faça sua inscrição</h1>
             <label for="nome de herói">Nome de herói:</label>
             <input id="nome de herói" name="nome de herói" type="text"/>

             <label for="email">E-mail:</label>
             <input id="email" name="email" type="email"/>

             <label for="idade">Idade:</label>
             <input id="idade" name="idade" type="number"/>

             <label for="escolha">Escolha sua equipe:</label>
             <select id="escolha" name="escolha">
                <option>Liga da justiça </option>
                <option>Vingadores</option>
                <option>X -men</option>
             </select>
              
            <h1>Qual poder você prefere?</h1>
            <section class="poder">
                 <label for="voar">Voar</label>
                 <input id="poder" name="poder" type="radio"/>
            </section>

            <section class="poder">
                  <input id="poder" name="poder" type="radio"/>
                 <label for="superforça">Superforça</label>
            </section>

            <section class="poder">
                 <input id="poder" name="poder" type="radio"/>
                 <label for="supervelocidade">Supervelocidade</label>
            </section>
                
            <section class="poder">
                 <input id="poder" name="poder" type="radio"/>
                 <label for="">Quero receber novas missões.</label>
            </section>
                 

             <label for="heroi">Por que você quer ser um héroi?</label>
             <textarea id="heroi" name="heroi" rows="4"></textarea>
             <button type="submit">Enviar inscrição</button> 
         </form>
     </main> 
    <footer>
        <p>Prática de formulários HTML.</p> 
    </footer> 
</body> 
</html>
